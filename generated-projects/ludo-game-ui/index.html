<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ludo Game</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="game">
  <!-- Ludo board -->
  <div id="board" class="board"></div>

  <!-- Controls and player info -->
  <div id="controls">
    <div id="dice" class="dice">🎲</div>
    <div id="players" class="players">
      <div class="player" id="player-red">
        <span class="color-box red"></span>Red
      </div>
      <div class="player" id="player-green">
        <span class="color-box green"></span>Green
      </div>
      <div class="player" id="player-yellow">
        <span class="color-box yellow"></span>Yellow
      </div>
      <div class="player" id="player-blue">
        <span class="color-box blue"></span>Blue
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
