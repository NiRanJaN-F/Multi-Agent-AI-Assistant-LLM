<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <h1>Task Manager</h1>
</header>

<main class="app-main">
  <form id="task-form" class="task-form">
    <input type="text" id="task-input" placeholder="Enter a new task" required autocomplete="off">
    <button type="submit" id="add-task-btn">Add Task</button>
  </form>

  <div class="filter-controls">
    <button id="filter-all" class="filter-btn active">All</button>
    <button id="filter-active" class="filter-btn">Active</button>
    <button id="filter-completed" class="filter-btn">Completed</button>
  </div>

  <ul id="task-list" class="task-list"></ul>
</main>

<footer class="app-footer">
  <p>&copy; 2026 Task Manager</p>
</footer>

<script src="app.js" defer></script>
</body>
</html>
