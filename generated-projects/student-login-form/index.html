<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                    </svg>
                </div>
                <h1>Student Portal</h1>
                <p class="login-subtitle">Sign in to access your academic dashboard</p>
            </div>

            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="studentName" class="form-label">
                        <span class="label-text">Full Name</span>
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input
                            type="text"
                            id="studentName"
                            name="studentName"
                            class="form-input"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                            minlength="2"
                            maxlength="100"
                        >
                    </div>
                    <span id="nameError" class="error-message" role="alert" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="regNumber" class="form-label">
                        <span class="label-text">Registration Number</span>
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="4" width="20" height="16" rx="2"/>
                                <path d="M7 15h0M2 9h20"/>
                                <path d="M12 15h5"/>
                            </svg>
                        </span>
                        <input
                            type="text"
                            id="regNumber"
                            name="regNumber"
                            class="form-input"
                            placeholder="e.g. STU-2024-0001"
                            autocomplete="off"
                            required
                            pattern="^[A-Za-z0-9\-]+$"
                            maxlength="20"
                        >
                    </div>
                    <span id="regError" class="error-message" role="alert" aria-live="polite"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span class="checkmark"></span>
                        <span class="checkbox-text">Remember me</span>
                    </label>
                </div>

                <button type="submit" id="loginBtn" class="btn btn-primary">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader" hidden>
                        <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                        </svg>
                    </span>
                </button>
            </form>

            <div id="loginMessage" class="login-message" role="status" aria-live="polite"></div>

            <div class="login-footer">
                <p>Don't have an account? <a href="#" id="registerLink">Register here</a></p>
            </div>
        </div>

        <div class="background-decoration">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
