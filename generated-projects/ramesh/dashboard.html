<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Credentials</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border: 1px solid #ddd; }
        th { background-color: #f4f4f4; }
        .logout { margin-top: 2rem; display: inline-block; padding: 0.5rem 1rem; background: #007BFF; color: #fff; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Student Credentials</h1>
    <p>Welcome! Below are your credentials:</p>

    <table>
        <thead>
            <tr>
                <th>Field</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Student ID</td>
                <td id="student-id">123456</td>
            </tr>
            <tr>
                <td>Name</td>
                <td id="student-name">John Doe</td>
            </tr>
            <tr>
                <td>Email</td>
                <td id="student-email">john.doe@example.com</td>
            </tr>
            <!-- Add more credential rows as needed -->
        </tbody>
    </table>

    <a href="index.html" class="logout">Log Out</a>
</body>
</html>
