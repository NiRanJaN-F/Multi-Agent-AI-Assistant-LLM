<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M18 8h1a4 4 0 0 1 0 8h-1'></path><path d='M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z'></path><line x1='6' y1='1' x2='6' y2='4'></line><line x1='10' y1='1' x2='10' y2='4'></line><line x1='14' y1='1' x2='14' y2='4'></line></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEO-CAFE // Cyberpunk Coffee & Neural Brews</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cyber: {
                950: '#030712',
                900: '#0b0f19',
                800: '#111827',
                700: '#1f2937',
                600: '#374151',
                cyan: '#06b6d4',
                neon: '#38bdf8',
                pink: '#ec4899',
                purple: '#8b5cf6'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },

              glow: {

                '100%': { boxShadow: '0 0 20px rgba(56, 189, 248, 0.6), 0 0 40px rgba(236, 72, 153, 0.3)' }
              }
            }
          }
        }
      }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Custom modern scrollbars & glassmorphism */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0b0f19;
      }
      ::-webkit-scrollbar-thumb {
        background: #1f2937;
        border-radius: 4px;
        border: 1px solid rgba(56, 189, 248, 0.2);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #374151;
      }

      .glass-panel {
        background: rgba(17, 24, 39, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .glass-card {
        background: linear-gradient(135deg, rgba(31, 41, 55, 0.4) 0%, rgba(17, 24, 39, 0.6) 100%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(56, 189, 248, 0.15);
      }

      .glass-card:hover {
        border-color: rgba(56, 189, 248, 0.4);
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
      }

      .text-glow {
        text-shadow: 0 0 10px rgba(56, 189, 248, 0.5), 0 0 20px rgba(56, 189, 248, 0.3);
      }

      .text-glow-pink {
        text-shadow: 0 0 10px rgba(236, 72, 153, 0.5), 0 0 20px rgba(236, 72, 153, 0.3);
      }

      .cyber-grid {
        background-size: 40px 40px;
        background-image: 
          linear-gradient(to right, rgba(56, 189, 248, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
      }
    </style>
  </head>
  <body class="bg-cyber-950 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-black cyber-grid min-h-screen">
    <!-- React, ReactDOM, Babel, Lucide CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useRef } = React;

      // --- Header Component ---
      function Header({ onOpenBooking }) {
        const [isScrolled, setIsScrolled] = useState(false);
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

        useEffect(() => {
          const handleScroll = () => {
            if (window.scrollY > 30) {
              setIsScrolled(true);
            } else {
              setIsScrolled(false);
            }
          };
          window.addEventListener('scroll', handleScroll);
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        return (
          <header className={`fixed top-0 left-0 w-full z-50 transition-all duration-300 ${
            isScrolled 
              ? 'bg-cyber-950/90 backdrop-blur-xl border-b border-cyan-500/20 py-4 shadow-[0_4px_30px_rgba(0,240,255,0.08)]' 
              : 'bg-transparent py-6'
          }`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
              
              <a href="#" className="flex items-center gap-3 group">
                <div className="relative w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-fuchsia-500 p-[1px] shadow-[0_0_15px_rgba(0,240,255,0.4)] group-hover:shadow-[0_0_25px_rgba(255,0,127,0.6)] transition-all duration-300">
                  <div className="w-full h-full bg-cyber-950 rounded-xl flex items-center justify-center">
                    <svg className="w-5 h-5 text-cyan-400 group-hover:text-fuchsia-400 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                      <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                      <line x1="6" y1="1" x2="6" y2="4"></line>
                      <line x1="10" y1="1" x2="10" y2="4"></line>
                      <line x1="14" y1="1" x2="14" y2="4"></line>
                    </svg>
                  </div>
                </div>
                <div className="flex flex-col">
                  <span className="font-bold text-lg tracking-wider text-white group-hover:text-cyan-400 transition-colors">
                    NEO<span className="text-fuchsia-500">-</span>CAFE
                  </span>
                  <span className="text-[10px] uppercase tracking-widest text-slate-400 font-mono">
                    // CYBER_BREW v2.4
                  </span>
                </div>
              </a>

              <nav className="hidden md:flex items-center gap-8">
                <a href="#menu" className="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors tracking-wide uppercase font-mono">
                  Neural Menu
                </a>
                <a href="#reviews" className="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors tracking-wide uppercase font-mono">
                  User Logs
                </a>
              </nav>

              <div className="hidden md:flex items-center gap-5">
                <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-mono shadow-[0_0_10px_rgba(16,185,129,0.1)]">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>NODE_ONLINE</span>
                </div>

                <button 
                  onClick={onOpenBooking}
                  className="relative group overflow-hidden rounded-xl p-[1px] focus:outline-none"
                >
                  <span className="absolute inset-0 bg-gradient-to-r from-cyan-500 via-fuchsia-500 to-cyan-500 rounded-xl"></span>
                  <span className="relative px-5 py-2.5 rounded-[11px] bg-cyber-950 flex items-center gap-2 text-xs font-bold tracking-wider text-cyan-400 group-hover:text-white transition-colors">
                    BOOK POD
                  </span>
                </button>
              </div>

            </div>
          </header>
        );
      }

      // --- Hero Component ---
      function Hero({ onOpenBooking }) {
        return (
          <section className="relative min-h-[92vh] flex items-center justify-center pt-28 pb-16 overflow-hidden">
            <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-cyan-600/15 rounded-full blur-[140px] pointer-events-none animate-pulse"></div>
            <div className="absolute bottom-10 right-10 w-[450px] h-[450px] bg-pink-600/10 rounded-full blur-[120px] pointer-events-none"></div>

            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full relative z-10">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                
                <div className="lg:col-span-7 text-center lg:text-left space-y-8">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyber-900/80 border border-cyan-500/30 text-cyan-400 text-xs sm:text-sm font-mono tracking-wider shadow-[0_0_20px_rgba(0,240,255,0.15)]">
                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                    <span>NEURAL FREQUENCY STABLE // SECTOR 07</span>
                  </div>

                  <h1 className="text-4xl sm:text-6xl xl:text-7xl font-extrabold tracking-tight leading-none">
                    TASTE THE <br />
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-pink-500">
                      FUTURE OF COFFEE
                    </span>
                  </h1>

                  <p className="text-slate-400 text-base sm:text-lg max-w-2xl mx-auto lg:mx-0 font-sans leading-relaxed">
                    Step into Neo-Cafe where cyberpunk aesthetics meet hyper-precise neural roasting. Handcrafted quantum espressos and data-infused pastries engineered to awaken your senses.
                  </p>

                  <div className="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4 pt-2">
                    <button
                      onClick={onOpenBooking}
                      className="w-full sm:w-auto px-8 py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-black font-bold text-sm tracking-widest uppercase transition-all shadow-[0_0_25px_rgba(0,240,255,0.4)] hover:scale-105 active:scale-95"
                    >
                      ⚡ INITIATE ORDER / BOOK POD
                    </button>
                    <a
                      href="#menu"
                      className="w-full sm:w-auto px-8 py-4 rounded-xl bg-cyber-900/60 hover:bg-cyber-800 text-slate-200 font-medium text-sm tracking-widest uppercase border border-slate-700/60 transition-all text-center"
                    >
                      Explore Menu
                    </a>
                  </div>

                  <div className="grid grid-cols-3 gap-4 pt-6 border-t border-slate-800/80 max-w-lg mx-auto lg:mx-0">
                    <div>
                      <div className="text-2xl sm:text-3xl font-black text-cyan-400">99.9%</div>
                      <div className="text-xs text-slate-400 font-mono">PURITY INDEX</div>
                    </div>
                    <div className="border-x border-slate-800/80 px-4">
                      <div className="text-2xl sm:text-3xl font-black text-pink-500">0.2s</div>
                      <div className="text-xs text-slate-400 font-mono">EXTRACTION</div>
                    </div>
                    <div>
                      <div className="text-2xl sm:text-3xl font-black text-teal-400">24/7</div>
                      <div className="text-xs text-slate-400 font-mono">CYBER BREW</div>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-5 relative flex items-center justify-center">
                  <div className="relative w-full max-w-md bg-cyber-900/70 border border-cyan-500/40 rounded-3xl p-6 sm:p-8 backdrop-blur-xl shadow-[0_0_50px_rgba(0,240,255,0.2)]">
                    <div className="flex items-center justify-between mb-4">
                      <span className="px-3 py-1 rounded-md bg-cyan-950/80 text-cyan-400 font-mono text-xs border border-cyan-500/30">
                        SPEC_01 // FEATURED
                      </span>
                      <span className="text-xs font-mono text-pink-400">● LIVE BREW</span>
                    </div>

                    <div className="relative w-full h-64 sm:h-72 rounded-2xl overflow-hidden bg-cyber-950 border border-slate-800">
                      <img 
                        src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=800&auto=format&fit=crop" 
                        alt="Cyberpunk Coffee" 
                        className="w-full h-full object-cover"
                      />
                      <div className="absolute bottom-4 left-4 bg-cyber-900/90 backdrop-blur-md px-4 py-2 rounded-xl border border-cyan-500/50">
                        <div className="text-[10px] text-slate-400 font-mono">NEURAL LATTE</div>
                        <div className="text-sm font-bold text-cyan-300">$6.50 // 0.0014 ETH</div>
                      </div>
                    </div>

                    <div className="mt-6 flex items-center justify-between">
                      <div>
                        <h3 className="font-bold text-white text-lg">Cybernetic Espresso</h3>
                        <p className="text-xs text-slate-400 mt-0.5">Infused with velvet quantum foam.</p>
                      </div>
                      <button
                        onClick={onOpenBooking}
                        className="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/40 text-cyan-400 flex items-center justify-center hover:bg-cyan-500 hover:text-black transition-all"
                      >
                        +
                      </button>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </section>
        );
      }

      // --- Menu Section ---
      function MenuSection({ onOpenBooking }) {
        const [activeCategory, setActiveCategory] = useState('all');
        const [cartCount, setCartCount] = useState(0);

        const items = [
          { id: 1, name: 'Cybernetic Espresso v2.4', category: 'espresso', price: '$6.50', caffeine: '300mg', image: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=800&auto=format&fit=crop', desc: 'Golden crema with micro-infused quantum foam.' },
          { id: 2, name: 'Quantum Cold Brew Zero', category: 'coldbrew', price: '$7.25', caffeine: '420mg', image: 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?q=80&w=800&auto=format&fit=crop', desc: 'Steeped 24 hours in sub-zero nitrogen chambers.' },
          { id: 3, name: 'Matrix Matcha Infusion', category: 'specialty', price: '$8.00', caffeine: '180mg', image: 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?q=80&w=800&auto=format&fit=crop', desc: 'Uji matcha blended with adaptogens and nano-honey.' },
          { id: 4, name: 'Neon Caramel Macchiato', category: 'espresso', price: '$7.75', caffeine: '250mg', image: 'https://images.unsplash.com/photo-1485808191679-5f86510681a2?q=80&w=800&auto=format&fit=crop', desc: 'Layered neon caramel drizzle with synthetic oat milk.' },
          { id: 5, name: 'Bioluminescent Nitro Float', category: 'coldbrew', price: '$8.50', caffeine: '350mg', image: 'https://images.unsplash.com/photo-1572490122747-3968b75cc699?q=80&w=800&auto=format&fit=crop', desc: 'Nitro cascade topped with blue spirulina sphere.' },
          { id: 6, name: 'Holo-Glazed Synth Croissant', category: 'pastry', price: '$5.50', caffeine: '0mg', image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?q=80&w=800&auto=format&fit=crop', desc: 'Flaky 512-layer butter pastry with iridescent glaze.' }
        ];

        const filtered = activeCategory === 'all' ? items : items.filter(i => i.category === activeCategory);

        return (
          <section id="menu" className="py-24 relative bg-cyber-950/80 border-t border-cyan-500/10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-3xl mx-auto mb-16">
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-mono mb-4">
                  <span>NEURAL MENU MATRIX</span>
                </div>
                <h2 className="text-3xl sm:text-5xl font-extrabold text-white tracking-tight mb-4">
                  ENGINEERED <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">BREWS</span>
                </h2>
                <p className="text-slate-400">Calibrated for maximum cognitive throughput and sensory enhancement.</p>
              </div>

              <div className="flex flex-wrap items-center justify-center gap-3 mb-12">
                {['all', 'espresso', 'coldbrew', 'specialty', 'pastry'].map(cat => (
                  <button
                    key={cat}
                    onClick={() => setActiveCategory(cat)}
                    className={`px-5 py-2.5 rounded-xl font-mono text-xs uppercase tracking-wider border transition-all ${
                      activeCategory === cat 
                        ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500 shadow-lg shadow-cyan-500/25' 
                        : 'bg-cyber-900/60 text-slate-400 border-slate-800 hover:border-cyan-500/50 hover:text-cyan-400'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                {filtered.map(item => (
                  <div key={item.id} className="bg-cyber-900/60 backdrop-blur-md border border-slate-800 hover:border-cyan-500/50 rounded-2xl overflow-hidden transition-all flex flex-col justify-between p-4">
                    <div className="relative h-48 w-full rounded-xl overflow-hidden mb-4 bg-cyber-950">
                      <img src={item.image} alt={item.name} className="w-full h-full object-cover" />
                      <div className="absolute top-3 right-3 bg-pink-600/90 text-white font-mono font-bold text-xs px-2.5 py-1 rounded-full">
                        {item.price}
                      </div>
                    </div>
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <h3 className="font-bold text-white text-base">{item.name}</h3>
                        <span className="text-[10px] font-mono bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded">⚡ {item.caffeine}</span>
                      </div>
                      <p className="text-slate-400 text-xs mb-4">{item.desc}</p>
                    </div>
                    <button
                      onClick={() => {
                        setCartCount(c => c + 1);
                        alert(`Queued ${item.name} into synthesis matrix!`);
                      }}
                      className="w-full py-2.5 bg-cyan-500 hover:bg-cyan-400 text-black font-mono font-semibold text-xs rounded-xl transition-all"
                    >
                      + ORDER NEURAL BREW
                    </button>
                  </div>
                ))}
              </div>

              <div className="mt-12 text-center">
                <span className="inline-flex items-center gap-2 px-5 py-2.5 bg-cyber-900 border border-slate-800 rounded-xl text-xs font-mono text-slate-300">
                  <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                  <span>Active Order Queue: <strong className="text-cyan-400">{cartCount} items</strong></span>
                </span>
              </div>
            </div>
          </section>
        );
      }

      // --- Booking Modal ---
      function BookingModal({ isOpen, onClose }) {
        const [confirmed, setConfirmed] = useState(false);
        const [name, setName] = useState('');
        const [date, setDate] = useState('');

        if (!isOpen) return null;

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
            <div className="relative w-full max-w-md bg-cyber-900 border border-cyan-500/40 rounded-2xl p-6 shadow-2xl text-white">
              <div className="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <h3 className="font-bold text-cyan-400 font-mono text-base">NEURAL POD RESERVATION</h3>
                <button onClick={onClose} className="text-slate-400 hover:text-white text-sm font-mono">✕</button>
              </div>

              {confirmed ? (
                <div className="text-center py-6 space-y-3">
                  <div className="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-xl">✓</div>
                  <h4 className="font-bold text-lg">Pod Reserved!</h4>
                  <p className="text-xs text-slate-400">Confirmation transmitted to your neural deck. Ref: #NEO-{Math.floor(Math.random()*90000+10000)}</p>
                  <button onClick={onClose} className="w-full py-2.5 mt-4 bg-cyan-500 text-black font-bold text-xs rounded-xl">CLOSE</button>
                </div>
              ) : (
                <form onSubmit={(e) => { e.preventDefault(); setConfirmed(true); }} className="space-y-4">
                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1">OPERATOR NAME</label>
                    <input required value={name} onChange={e => setName(e.target.value)} placeholder="Kaelen Voss" className="w-full bg-cyber-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white" />
                  </div>
                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1">DATE & TIME</label>
                    <input required type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-cyber-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white" />
                  </div>
                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1">SEATING POD</label>
                    <select className="w-full bg-cyber-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                      <option>Hacker Pod (Isolated 1-2p)</option>
                      <option>Cyber Deck Lounge (3-4p)</option>
                      <option>Barista Terminal Counter</option>
                    </select>
                  </div>
                  <button type="submit" className="w-full py-3 bg-gradient-to-r from-cyan-500 to-fuchsia-500 text-black font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-cyan-500/20">
                    CONFIRM RESERVATION
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      // --- Footer ---
      function Footer({ onOpenBooking }) {
        return (
          <footer className="bg-cyber-950 border-t border-cyan-500/20 text-slate-400 py-12 text-center text-xs font-mono">
            <p className="text-white font-bold text-sm mb-2">NEO-CAFE // NEURAL BREWERY</p>
            <p className="text-slate-500 mb-4">© 2026 NEO-CAFE SECTOR 07. ALL RIGHTS RESERVED.</p>
            <button onClick={onOpenBooking} className="text-cyan-400 underline">RESERVE A BOOTH</button>
          </footer>
        );
      }

      // --- Main App ---
      function App() {
        const [isBookingOpen, setIsBookingOpen] = useState(false);

        return (
          <div className="min-h-screen bg-cyber-950 text-slate-100 overflow-x-hidden">
            <Header onOpenBooking={() => setIsBookingOpen(true)} />
            <main>
              <Hero onOpenBooking={() => setIsBookingOpen(true)} />
              <MenuSection onOpenBooking={() => setIsBookingOpen(true)} />
            </main>
            <Footer onOpenBooking={() => setIsBookingOpen(true)} />
            <BookingModal isOpen={isBookingOpen} onClose={() => setIsBookingOpen(false)} />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
