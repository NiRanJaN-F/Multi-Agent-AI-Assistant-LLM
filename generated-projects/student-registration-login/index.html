<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Registration &amp; Login Portal – secure access to the academic management system.">
  <title>Student Registration &amp; Login Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header" role="banner">
      <div class="header-content">
        <div class="logo" aria-label="Student Portal Logo">
          <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
          <h1>Student Portal</h1>
        </div>
        <p class="header-subtitle">Academic Registration &amp; Management System</p>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" role="main">
      <section class="auth-section">
        <!-- Tabs -->
        <div class="auth-tabs" role="tablist" aria-label="Authentication tabs">
          <button type="button" class="auth-tab active" id="tab-login" data-tab="login"
                  role="tab" aria-selected="true" aria-controls="panel-login">
            Login
          </button>
          <button type="button" class="auth-tab" id="tab-register" data-tab="register"
                  role="tab" aria-selected="false" aria-controls="panel-register">
            Register
          </button>
        </div>

        <!-- Login Panel -->
        <div class="auth-panel active" id="panel-login" role="tabpanel"
             aria-labelledby="tab-login">
          <form id="login-form" class="auth-form" novalidate>
            <header class="form-header">
              <h2>Welcome Back</h2>
              <p>Sign in to access your student dashboard</p>
            </header>

            <div class="form-group">
              <label for="login-email">Email Address</label>
              <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
