<!DOCTYPE html>
<html lang="en">
<head>
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root">
    <h1>Welcome to the Workout Tracker</h1>
    <main id="main">
      <h2>Exercise Log</h2>
      <form id="exercise-form">
        <label for="exercise-name">Exercise Name:</label>
        <input type="text" id="exercise-name" name="exercise-name" required><br><br>
        <label for="exercise-date">Date:</label>
        <input type="date" id="exercise-date" name="exercise-date" required><br><br>
        <label for="exercise-duration">Duration (in minutes):</label>
        <input type="number" id="exercise-duration" name="exercise-duration" step="1" required><br><br>
        <label for="exercise-set-1">Sets 1:</label>
        <input type="number" id="exercise-set-1" name="exercise-set-1" required><br><br>
        <label for="exercise-set-2">Sets 2:</label>
        <input type="number" id="exercise-set-2" name="exercise-set-2" required><br><br>
        <label for="exercise-set-3">Sets 3:</label>
        <input type="number" id="exercise-set-3" name="exercise-set-3" required><br><br>
        <button type="submit">Add Exercise</button>
      </form>
    </main>
  </div>
</body>
</html>
