<!DOCTYPE html>
   <html lang="en">
   <head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Vote</title>
       <link rel="stylesheet" href="styles.css">
   </head>
   <body>
       <main class="vote-container">
           <h1>Cast Your Vote</h1>
           <p>Please select your preferred option below:</p>
           
           <form id="voteForm">
               <div class="vote-option">
                   <input type="radio" id="option1" name="vote" value="option1" required>
                   <label for="option1">Option 1</label>
               </div>
               <div class="vote-option">
                   <input type="radio" id="option2" name="vote" value="option2">
                   <label for="option2">Option 2</label>
               </div>
               <div class="vote-option">
                   <input type="radio" id="option3" name="vote" value="option3">
                   <label for="option3">Option 3</label>
               </div>
               
               <button type="submit" class="vote-btn">Submit Vote</button>
           </form>
           
           <div id="voteResult" class="vote-result" hidden>
               <h2>Thank you!</h2>
               <p>Your vote has been recorded successfully.</p>
               <a href="index.html" class="back-link">Return to Home</a>
           </div>
       </main>

       <script src="app.js"></script>
       <script>
           document.getElementById('voteForm').addEventListener('submit', function(e) {
               e.preventDefault();
               const selectedOption = document.querySelector('input[name="vote"]:checked');
               if (selectedOption) {
                   // In a real app, this would send data to a backend
                   console.log('Vote submitted for:', selectedOption.value);
                   document.getElementById('voteForm').hidden = true;
                   document.getElementById('voteResult').hidden = false;
               }
           });
       </script>
   </body>
   </html>
