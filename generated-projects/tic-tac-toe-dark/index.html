<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='3' rx='2'/><path d='M9 3v18'/><path d='M15 3v18'/><path d='M3 9h18'/><path d='M3 15h18'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus X/O — Modern Dark Tic-Tac-Toe</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              dark: {
                950: '#030712',
                900: '#0a0f1d',
                800: '#111827',
                700: '#1f2937',
              }
            },
            keyframes: {
              pulseGlow: {
                '0%, 100%': { opacity: 0.4, transform: 'scale(1)' },
                '50%': { opacity: 0.8, transform: 'scale(1.05)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            },
            animation: {
              'pulse-glow': 'pulseGlow 6s ease-in-out infinite',
              'float': 'float 4s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #030712;
        color: #f3f4f6;
        overflow-x: hidden;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0f1d;
      }
      ::-webkit-scrollbar-thumb {
        background: #1f2937;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #374151;
      }

      /* Glassmorphism background glows */
      .bg-glow-1 {
        position: absolute;
        top: 10%;
        left: 20%;
        width: 350px;
        height: 350px;
        background: rgba(56, 189, 248, 0.08);
        filter: blur(90px);
        border-radius: 50%;
        pointer-events: none;
      }

      .bg-glow-2 {
        position: absolute;
        bottom: 10%;
        right: 20%;
        width: 350px;
        height: 350px;
        background: rgba(244, 63, 94, 0.08);
        filter: blur(90px);
        border-radius: 50%;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="bg-dark-950 text-gray-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
