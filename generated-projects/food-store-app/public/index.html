<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Store</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/style.css">
</head>
<body class="font-inter bg-gray-50 min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="sticky top-0 z-30 bg-white shadow-sm">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <!-- Brand -->
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-bold text-indigo-600">FoodStore</span>
        <span class="text-sm font-medium text-gray-500">🍔</span>
      </div>

      <!-- Search -->
      <div class="flex-1 mx-4">
        <input id="search-input"
               type="text"
               placeholder="Search foods..."
               class="w-full py-2 pl-4 pr-10 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
        />
        <i data-lucide="search" class="absolute right-4 top-2.5 text-gray-400"></i>
      </div>

      <!-- Actions -->
      <div class="flex items-center space-x-4">
        <button id="filter-btn" class="p-2 rounded-full hover:bg-gray-100 focus:outline-none" title="Filter">
          <i data-lucide="filter"></i>
        </button>
        <button id="cart-btn"
                class="relative p-2 rounded-full hover:bg-gray-100 focus:outline-none"
                title="Cart">
          <i data-lucide="shopping-cart"></i>
          <span id="cart-count"
                class="absolute -top-1 -right-1 bg-indigo-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">
            0
          </span>
        </button>
      </div>
    </nav>
  </header>

  <!-- Hero / Filter Bar -->
  <section class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <h1 class="text-4xl font-bold mb-2">Delicious Meals Delivered To You</h1>
      <p class="text-lg opacity-90 mb-6">Explore our menu and add your favorites to the cart.</p>

      <!-- Category Filters -->
      <div id="category-filters" class="flex flex-wrap justify-center gap-2">
        <button data-category="all"
                class="px-4 py-2 bg-white text-indigo-600 rounded-full hover:bg-indigo-50 transition">
          All
        </button>
        <button data-category="burger"
                class="px-4 py-2 bg-white text-indigo-600 rounded-full hover:bg-indigo-50 transition">
          Burgers
        </button>
        <button data-category="pizza"
                class="px-4 py-2 bg-white text-indigo-600 rounded-full hover:bg-indigo-50 transition">
          Pizza
        </button>
        <button data-category="sushi"
                class="px-4 py-2 bg-white text-indigo-600 rounded-full hover:bg-indigo-50 transition">
          Sushi
        </button>
        <button data-category="dessert"
                class="px-4 py-2 bg-white text-indigo-600 rounded-full hover:bg-indigo-50 transition">
          Desserts
        </button>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="product-grid"
         class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Product cards will be injected here by app.js -->
    </div>
  </main>

  <!-- Cart Sidebar (Drawer) -->
  <aside id="cart-sidebar"
         class="fixed inset-y-0 right-0 w-80 bg-white shadow-lg transform translate-x-full transition-transform duration-300 ease-in-out z-40 flex flex-col">
    <header class="flex items-center justify-between p-4 border-b">
      <h2 class="text-lg font-semibold">Your Cart</h2>
      <button id="close-cart"
              class="p-2 rounded-full hover:bg-gray-100 focus:outline-none">
        <i data-lucide="x"></i>
      </button>
    </header>

    <ul id="cart-items"
        class="flex-1 overflow-y-auto p-4 space-y-4">
      <!-- Cart items injected here -->
    </ul>

    <footer class="p-4 border-t">
      <div class="flex justify-between items-center mb-4">
        <span class="font-medium">Total:</span>
        <span id="cart-total" class="text-xl font-bold">$0.00</span>
      </div>
      <button id="checkout-btn"
              class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition">
        Checkout
      </button>
    </footer>
  </aside>

  <!-- Checkout Modal -->
  <div id="checkout-modal"
       class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg w-full max-w-md mx-4 p-6 relative">
      <button id="close-modal"
              class="absolute top-3 right-3 p-2 rounded-full hover:bg-gray-100 focus:outline-none">
        <i data-lucide="x"></i>
      </button>
      <h3 class="text-xl font-semibold mb-4">Checkout</h3>

      <form id="checkout-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1" for="customer-name">Name</label>
          <input id="customer-name"
                 type="text"
                 required
                 class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" for="customer-email">Email</label>
          <input id="customer-email"
                 type="email"
                 required
                 class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" for="customer-address">Address</label>
          <textarea id="customer-address"
                    rows="3"
                    required
                    class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition">
          Confirm Order
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"
       class="fixed bottom-4 right-4 flex flex-col gap-2 z-50">
    <!-- Toasts injected by app.js -->
  </div>

  <!-- Footer -->
  <footer class="bg-gray-800 text-gray-200 py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <p class="mb-4">&copy; <span id="year"></span> FoodStore. All rights reserved.</p>
      <div class="flex justify-center space-x-4">
        <a href="#" class="hover:text-white transition">Privacy Policy</a>
        <a href="#" class="hover:text-white transition">Terms of Service</a>
        <a href="#" class="hover:text-white transition">Contact</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/app.js" defer></script>
  <script>
    // Initialize Lucide icons after the page loads
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      // Set current year in footer
      document.getElementById('year').textContent = new Date().getFullYear();
    });
  </script>
</body>
</html>
